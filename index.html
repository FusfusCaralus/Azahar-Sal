<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Boda de Azahar & Sal</title>
<meta name="description" content="Miren & Ale — 3 de octubre de 2026, Isla de León. Todo lo que se pueda celebrar, se celebra.">
<meta property="og:title" content="Boda de Azahar & Sal">
<meta property="og:description" content="Miren & Ale — 3 de octubre de 2026, Isla de León. Todo lo que se pueda celebrar, se celebra.">
<meta property="og:image" content="cover.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Boda de Azahar & Sal">
<meta name="twitter:description" content="Miren & Ale — 3 de octubre de 2026, Isla de León.">
<meta name="twitter:image" content="cover.jpg">
<style>
  :root{
    --bg: #eef2ef;
    --card-shadow: 0 30px 60px -20px rgba(40,60,55,0.35), 0 8px 20px -8px rgba(40,60,55,0.25);
    --dot: #c7d3cc;
    --dot-active: #6c8f83;
    --hint: #7c8b85;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
  }
  body{
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 8% 4%, rgba(120,160,175,0.16), transparent 60%),
      radial-gradient(ellipse 55% 42% at 96% 10%, rgba(150,140,120,0.13), transparent 60%),
      radial-gradient(ellipse 60% 50% at 6% 100%, rgba(148,138,168,0.14), transparent 62%),
      radial-gradient(ellipse 55% 45% at 100% 96%, rgba(108,143,131,0.15), transparent 60%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.34;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='46' height='46'><g fill='none' stroke='%237f9a8c' stroke-width='0.85' stroke-linecap='round' opacity='0.55'><path d='M-4 9 Q 4 3 12 9 T 28 9 T 44 9 T 60 9'/><path d='M-4 32 Q 4 26 12 32 T 28 32 T 44 32 T 60 32'/></g><g fill='%237f9a8c' opacity='0.44'><ellipse cx='7' cy='24' rx='4.3' ry='1.7' transform='rotate(-30 7 24)'/></g><g stroke='%236c8f83' stroke-width='0.4' opacity='0.5'><path d='M4.3 25.1 L9.7 22.9'/></g><g fill='%239487a8' opacity='0.42'><ellipse cx='32' cy='4' rx='3.9' ry='1.5' transform='rotate(38 32 4)'/></g><g stroke='%238678a0' stroke-width='0.4' opacity='0.46'><path d='M29.8 5.9 L34.2 2.1'/></g><g fill='%237f9a8c' opacity='0.38'><ellipse cx='38' cy='27' rx='3.6' ry='1.4' transform='rotate(-15 38 27)'/></g><g stroke='%236c8f83' stroke-width='0.4' opacity='0.42'><path d='M35.8 28 L40.2 26'/></g><g fill='%239487a8' opacity='0.36'><ellipse cx='19' cy='17' rx='3.4' ry='1.3' transform='rotate(60 19 17)'/></g><g stroke='%238678a0' stroke-width='0.4' opacity='0.4'><path d='M17.5 14.3 L20.5 19.7'/></g><g fill='%237f9a8c' opacity='0.34'><ellipse cx='27' cy='39' rx='3.1' ry='1.2' transform='rotate(-42 27 39)'/></g><g stroke='%236c8f83' stroke-width='0.35' opacity='0.38'><path d='M25.1 40.9 L28.9 37.1'/></g><g fill='%239487a8' opacity='0.34'><ellipse cx='0' cy='40' rx='3' ry='1.1' transform='rotate(20 0 40)'/></g><g fill='%237f9a8c' opacity='0.3'><ellipse cx='45' cy='18' rx='2.8' ry='1.1' transform='rotate(-50 45 18)'/></g></svg>");
    background-size:46px 46px;
  }
  .screen{
    width:100%;
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding: max(14px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
    position:relative;
    z-index:1;
  }

  .stage{
    width:100%;
    max-width:min(92vw, 640px);
    max-height:80vh;
    max-height:80dvh;
    flex: 0 1 auto;
    -webkit-perspective: 1800px;
    perspective: 1800px;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    cursor:pointer;
    user-select:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    max-width:min(92vw, 640px);
    max-height:min(92vw, 640px);
    aspect-ratio: 1 / 1;
    -webkit-transform-style:preserve-3d;
    transform-style:preserve-3d;
    transition: transform 0.7s cubic-bezier(.65,.05,.36,1);
    will-change: transform;
    margin:auto;
  }
  .card.spin{ transform: rotateY(180deg); }
  .card.noanim{ transition:none !important; }

  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    will-change: transform;
    border-radius: 14px;
    overflow:visible;
    background:#fff;
    box-shadow: var(--card-shadow);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .face.back{
    -webkit-transform: rotateY(180deg) translateZ(0);
    transform: rotateY(180deg) translateZ(0);
  }
  .face.is-card-face{
    background:transparent;
    box-shadow:none;
  }

  .face img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
  }

  .cardwrap{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cardwrap.as-card{
    width:82%;
    height:auto;
    aspect-ratio: 1300 / 842;
    margin:auto;
  }
  .cardwrap.as-card img{
    width:100%;
    height:100%;
    object-fit:fill;
    border-radius:6px;
    box-shadow: 0 14px 30px -10px rgba(40,60,55,0.28);
  }

  .iban-btn{
    position:absolute;
    left:15.0%;
    top:52.2%;
    width:69.8%;
    height:7.9%;
    display:none;
    align-items:center;
    justify-content:center;
    gap:0.5em;
    border:none;
    background:transparent;
    padding:0;
    margin:0;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight:600;
    line-height:1;
    letter-spacing:0.09em;
    color: var(--iban-green, #4c7a63);
    white-space:nowrap;
    overflow:hidden;
    transition: transform .15s ease, opacity .15s ease;
  }
  .iban-btn.visible{ display:flex; }
  .iban-btn:active{ transform: scale(0.96); opacity:0.75; }
  .iban-btn svg{
    width:0.85em;
    height:0.85em;
    flex:0 0 auto;
    opacity:0.8;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom: max(26px, env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    background: #3f5a4d;
    color:#fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:13px;
    letter-spacing:.02em;
    padding:10px 18px;
    border-radius:999px;
    box-shadow: 0 10px 24px -8px rgba(20,30,26,0.4);
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    z-index:5;
  }
  .toast.show{
    opacity:1;
    transform: translate(-50%, 0);
  }

  .dots{
    display:flex;
    gap:9px;
    align-items:center;
    flex:0 0 auto;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--dot);
    transition: background .35s ease, transform .35s ease;
  }
  .dot.active{
    background: var(--dot-active);
    transform: scale(1.35);
  }

  .hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--hint);
    opacity: .85;
    text-align:center;
    transition: opacity .5s ease;
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .hint.fade{ opacity: 0; }

  .hint svg{
    width:13px; height:13px;
    animation: tapbeat 1.8s ease-in-out infinite;
  }
  @keyframes tapbeat{
    0%,100%{ transform: scale(1); opacity:.9; }
    50%{ transform: scale(1.18); opacity:1; }
  }

  .music{
    position:fixed;
    left:-9999px;
    top:-9999px;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
  }
  .music iframe{
    display:block;
    width:1px;
    height:1px;
    border:0;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition-duration: .01ms; }
    .hint svg{ animation: none; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="stage" id="stage" role="button" aria-label="Toca para pasar la página">
    <div class="card" id="card">
      <div class="face front">
        <div class="cardwrap" id="cardWrapFront">
          <img id="imgFront" src="cover.jpg" alt="">
          <button class="iban-btn" id="ibanFront" type="button" aria-label="Copiar número de cuenta">
            <span>ES03 0128 7820 8101 0256 1495</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"/>
              <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="face back">
        <div class="cardwrap" id="cardWrapBack">
          <img id="imgBack" src="invite.jpg" alt="">
          <button class="iban-btn" id="ibanBack" type="button" aria-label="Copiar número de cuenta">
            <span>ES03 0128 7820 8101 0256 1495</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"/>
              <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Número copiado</div>

  <div class="dots" id="dots">
    <span class="dot active" data-i="0"></span>
    <span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span>
  </div>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4"/>
      <path d="M12 9.8V4.5a1.5 1.5 0 0 1 3 0V10"/>
      <path d="M15 9.5a1.5 1.5 0 0 1 3 0V13"/>
      <path d="M6 11V8.5a1.5 1.5 0 0 1 3-.2"/>
      <path d="M18 13v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-5.6-3.8L4 14.5c-.5-1 .1-2.3 1.4-2.4a1.7 1.7 0 0 1 1.6.9"/>
    </svg>
    <span>Toca para pasar la página</span>
  </div>

  <div class="music" id="music">
    <iframe id="spotifyEmbed"
      src="https://open.spotify.com/embed/track/2mMZ6RsGVCUJwNuJekjlAx?utm_source=generator&theme=0"
      height="80"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
      title="Canción de la boda"></iframe>
  </div>
</div>

<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>

<script>
(function(){
  var images = ["cover.jpg", "invite.jpg", "thanks.jpg"];
  var idx = 0; // index currently shown on front
  var spinning = false;

  var card = document.getElementById('card');
  var stage = document.getElementById('stage');
  var faceFront = document.querySelector('.face.front');
  var faceBack = document.querySelector('.face.back');
  var cardWrapFront = document.getElementById('cardWrapFront');
  var cardWrapBack = document.getElementById('cardWrapBack');
  var imgFront = document.getElementById('imgFront');
  var imgBack = document.getElementById('imgBack');
  var ibanFront = document.getElementById('ibanFront');
  var ibanBack = document.getElementById('ibanBack');
  var toast = document.getElementById('toast');
  var hint = document.getElementById('hint');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  var IBAN_TEXT = "ES03 0128 7820 8101 0256 1495";
  var IBAN_RAW = "ES0301287820810102561495";

  function next(idx){ return (idx + 1) % images.length; }

  // "thanks.jpg" (the account/IBAN page) shows at real card size, floating
  // directly on the textured background instead of inside a white square.
  // The image and its copy-button live in one wrapper sized to the card's
  // exact proportions, so the button lines up with the blanked-out number
  // by simple percentages — no per-screen measuring needed.
  function setCardLook(faceEl, wrapEl, imageIndex){
    var isCard = images[imageIndex] === 'thanks.jpg';
    wrapEl.classList.toggle('as-card', isCard);
    faceEl.classList.toggle('is-card-face', isCard);
  }

  function fitIbanText(btnEl){
    if (getComputedStyle(btnEl).display === 'none') return;
    var span = btnEl.querySelector('span');
    var h = btnEl.clientHeight;
    var startSize = Math.max(6, h * 0.60);
    btnEl.style.fontSize = startSize + 'px';
    var guard = 24;
    while (guard-- > 0 && span.scrollWidth > btnEl.clientWidth - 4 && parseFloat(btnEl.style.fontSize) > 5){
      btnEl.style.fontSize = (parseFloat(btnEl.style.fontSize) - 0.5) + 'px';
    }
  }

  function refreshIbanButtons(){
    ibanFront.classList.toggle('visible', cardWrapFront.classList.contains('as-card'));
    ibanBack.classList.toggle('visible', cardWrapBack.classList.contains('as-card'));
    fitIbanText(ibanFront);
    fitIbanText(ibanBack);
  }

  function showToast(){
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toast.classList.remove('show'); }, 1600);
  }

  function copyIban(e){
    e.preventDefault();
    e.stopPropagation();
    function done(){ showToast(); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(IBAN_RAW).then(done).catch(function(){ fallbackCopy(); });
    } else {
      fallbackCopy();
    }
    function fallbackCopy(){
      var ta = document.createElement('textarea');
      ta.value = IBAN_RAW;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch(err){}
      document.body.removeChild(ta);
      done();
    }
  }

  ibanFront.addEventListener('click', copyIban);
  ibanBack.addEventListener('click', copyIban);

  window.addEventListener('resize', refreshIbanButtons);
  window.addEventListener('orientationchange', function(){ setTimeout(refreshIbanButtons, 60); });

  setCardLook(faceFront, cardWrapFront, idx);

  imgBack.src = images[next(idx)];
  setCardLook(faceBack, cardWrapBack, next(idx));

  refreshIbanButtons();

  function setDots(activeIdx){
    dots.forEach(function(d){
      d.classList.toggle('active', parseInt(d.dataset.i,10) === activeIdx);
    });
  }

  function flip(){
    if (spinning) return;
    spinning = true;
    hint.classList.add('fade');

    card.classList.add('spin');

    card.addEventListener('transitionend', function onEnd(e){
      if (e.propertyName !== 'transform') return;
      card.removeEventListener('transitionend', onEnd);

      idx = next(idx);
      var upcoming = next(idx);

      // Snap back to 0deg instantly, with the (now current) image as the front face.
      card.classList.add('noanim');
      card.classList.remove('spin');
      imgFront.src = images[idx];
      imgBack.src = images[upcoming];
      setCardLook(faceFront, cardWrapFront, idx);
      setCardLook(faceBack, cardWrapBack, upcoming);

      // Force reflow so the browser applies the no-transition jump before we re-enable it.
      void card.offsetWidth;
      card.classList.remove('noanim');

      refreshIbanButtons();
      setDots(idx);
      spinning = false;
    });
  }

  stage.addEventListener('click', flip);

  stage.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      flip();
    }
  });
  stage.setAttribute('tabindex', '0');

  // basic swipe support
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) > 30) flip();
  }, {passive:true});

  // Try to start the song the moment the page is ready; most browsers still
  // block sound before any tap, so this also arms on the very first
  // interaction (usually the tap that opens the card) as a fallback.
  var spotifyController = null;

  function rampVolume(){
    if (!spotifyController || typeof spotifyController.setVolume !== 'function') return;
    var steps = [0.08, 0.14, 0.20, 0.28, 0.35];
    steps.forEach(function(v, i){
      setTimeout(function(){
        try { spotifyController.setVolume(v); } catch(err){}
      }, i * 700);
    });
  }

  function tryPlay(){
    if (!spotifyController) return;
    try {
      if (typeof spotifyController.setVolume === 'function'){
        spotifyController.setVolume(0.08);
      }
      spotifyController.play();
      rampVolume();
    } catch(err){}
  }

  window.onSpotifyIframeApiReady = function(IFrameAPI){
    var element = document.getElementById('spotifyEmbed');
    var options = { uri: 'spotify:track:2mMZ6RsGVCUJwNuJekjlAx' };
    IFrameAPI.createController(element, options, function(EmbedController){
      spotifyController = EmbedController;
      tryPlay();
    });
  };

  document.addEventListener('pointerdown', tryPlay, {once:true, passive:true});
  document.addEventListener('touchstart', tryPlay, {once:true, passive:true});
})();
</script>
</body>
</html>
