<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Miren & Ale</title>
<style>
  :root{
    --bg: #eef2ef;
    --card-shadow: 0 30px 60px -20px rgba(40,60,55,0.35), 0 8px 20px -8px rgba(40,60,55,0.25);
    --dot: #c7d3cc;
    --dot-active: #6c8f83;
    --hint: #7c8b85;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
  }
  body{
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 8% 4%, rgba(120,160,175,0.16), transparent 60%),
      radial-gradient(ellipse 55% 42% at 96% 10%, rgba(150,140,120,0.13), transparent 60%),
      radial-gradient(ellipse 60% 50% at 6% 100%, rgba(148,138,168,0.14), transparent 62%),
      radial-gradient(ellipse 55% 45% at 100% 96%, rgba(108,143,131,0.15), transparent 60%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.05;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:180px 180px;
  }
  .screen{
    width:100%;
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding: max(14px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
    position:relative;
    z-index:1;
  }

  .stage{
    width:100%;
    max-width: var(--stagemax, min(97vw, 720px));
    max-height:76vh;
    max-height:76dvh;
    transition: max-width 0.7s cubic-bezier(.65,.05,.36,1);
    flex: 1 1 auto;
    perspective: 1800px;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    cursor:pointer;
    user-select:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    aspect-ratio: var(--ar, 1 / 1);
    transform-style:preserve-3d;
    transition: transform 0.7s cubic-bezier(.65,.05,.36,1);
    will-change: transform;
    margin:auto;
  }
  .card.spin{ transform: rotateY(180deg); }
  .card.noanim{ transition:none !important; }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius: 14px;
    overflow:hidden;
    background:#fff;
    box-shadow: var(--card-shadow);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .face.back{ transform: rotateY(180deg); }

  .face img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
  }

  .dots{
    display:flex;
    gap:9px;
    align-items:center;
    flex:0 0 auto;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--dot);
    transition: background .35s ease, transform .35s ease;
  }
  .dot.active{
    background: var(--dot-active);
    transform: scale(1.35);
  }

  .hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--hint);
    opacity: .85;
    text-align:center;
    transition: opacity .5s ease;
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .hint.fade{ opacity: 0; }

  .hint svg{
    width:13px; height:13px;
    animation: tapbeat 1.8s ease-in-out infinite;
  }
  @keyframes tapbeat{
    0%,100%{ transform: scale(1); opacity:.9; }
    50%{ transform: scale(1.18); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition-duration: .01ms; }
    .hint svg{ animation: none; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="stage" id="stage" role="button" aria-label="Toca para pasar la página">
    <div class="card" id="card">
      <div class="face front">
        <img id="imgFront" src="cover.jpg" alt="">
      </div>
      <div class="face back">
        <img id="imgBack" src="invite.jpg" alt="">
      </div>
    </div>
  </div>

  <div class="dots" id="dots">
    <span class="dot active" data-i="0"></span>
    <span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span>
  </div>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4"/>
      <path d="M12 9.8V4.5a1.5 1.5 0 0 1 3 0V10"/>
      <path d="M15 9.5a1.5 1.5 0 0 1 3 0V13"/>
      <path d="M6 11V8.5a1.5 1.5 0 0 1 3-.2"/>
      <path d="M18 13v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-5.6-3.8L4 14.5c-.5-1 .1-2.3 1.4-2.4a1.7 1.7 0 0 1 1.6.9"/>
    </svg>
    <span>Toca para pasar la página</span>
  </div>
</div>

<script>
(function(){
  var images = ["cover.jpg", "invite.jpg", "thanks.jpg"];
  var idx = 0; // index currently shown on front
  var spinning = false;

  var card = document.getElementById('card');
  var stage = document.getElementById('stage');
  var imgFront = document.getElementById('imgFront');
  var imgBack = document.getElementById('imgBack');
  var hint = document.getElementById('hint');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function next(idx){ return (idx + 1) % images.length; }

  function setAspectFromImg(img){
    if (img.naturalWidth && img.naturalHeight){
      card.style.setProperty('--ar', img.naturalWidth + ' / ' + img.naturalHeight);
    }
  }

  // "thanks.jpg" (the account/IBAN page) shows at real card size; the other
  // two pages fill as much of the screen as possible.
  function setStageSizeFor(imageIndex){
    var isCardPage = images[imageIndex] === 'thanks.jpg';
    stage.style.setProperty('--stagemax', isCardPage ? 'min(80vw, 420px)' : 'min(97vw, 720px)');
  }

  setStageSizeFor(idx);

  if (imgFront.complete) setAspectFromImg(imgFront);
  imgFront.addEventListener('load', function(){ setAspectFromImg(imgFront); });

  imgBack.src = images[next(idx)];

  function setDots(activeIdx){
    dots.forEach(function(d){
      d.classList.toggle('active', parseInt(d.dataset.i,10) === activeIdx);
    });
  }

  function flip(){
    if (spinning) return;
    spinning = true;
    hint.classList.add('fade');

    card.classList.add('spin');

    card.addEventListener('transitionend', function onEnd(e){
      if (e.propertyName !== 'transform') return;
      card.removeEventListener('transitionend', onEnd);

      idx = next(idx);
      var upcoming = next(idx);

      // Snap back to 0deg instantly, with the (now current) image as the front face.
      card.classList.add('noanim');
      card.classList.remove('spin');
      imgFront.src = images[idx];
      imgBack.src = images[upcoming];
      setAspectFromImg(imgFront);
      setStageSizeFor(idx);
      if (!imgFront.complete) {
        imgFront.addEventListener('load', function onLoad(){
          imgFront.removeEventListener('load', onLoad);
          setAspectFromImg(imgFront);
        });
      }

      // Force reflow so the browser applies the no-transition jump before we re-enable it.
      void card.offsetWidth;
      card.classList.remove('noanim');

      setDots(idx);
      spinning = false;
    });
  }

  stage.addEventListener('click', flip);

  stage.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      flip();
    }
  });
  stage.setAttribute('tabindex', '0');

  // basic swipe support
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) > 30) flip();
  }, {passive:true});
})();
</script>
</body>
</html>
