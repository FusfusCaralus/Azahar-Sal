<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Miren & Ale</title>
<style>
  :root{
    --bg: #eef2ef;
    --card-shadow: 0 30px 60px -20px rgba(40,60,55,0.35), 0 8px 20px -8px rgba(40,60,55,0.25);
    --dot: #c7d3cc;
    --dot-active: #6c8f83;
    --hint: #7c8b85;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    margin:0;
  }
  body{
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  body::before{
    content:"";
    position:fixed;
    inset:-10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 60% 45% at 8% 4%, rgba(120,160,175,0.16), transparent 60%),
      radial-gradient(ellipse 55% 42% at 96% 10%, rgba(150,140,120,0.13), transparent 60%),
      radial-gradient(ellipse 60% 50% at 6% 100%, rgba(148,138,168,0.14), transparent 62%),
      radial-gradient(ellipse 55% 45% at 100% 96%, rgba(108,143,131,0.15), transparent 60%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    opacity:0.22;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><g fill='none' stroke='%237f9a8c' stroke-width='1' stroke-linecap='round' opacity='0.55'><path d='M-10 88 Q 12 76 34 88 T 78 88 T 122 88'/></g><g fill='%237f9a8c' opacity='0.45'><ellipse cx='18' cy='24' rx='6.5' ry='2.6' transform='rotate(-28 18 24)'/></g><g stroke='%236c8f83' stroke-width='0.5' opacity='0.5'><path d='M13 27 L23 21'/></g><g fill='%239487a8' opacity='0.4'><ellipse cx='72' cy='16' rx='6' ry='2.4' transform='rotate(48 72 16)'/></g><g stroke='%238678a0' stroke-width='0.5' opacity='0.45'><path d='M68 20 L76 12'/></g><g fill='%237f9a8c' opacity='0.32'><ellipse cx='80' cy='62' rx='5' ry='2' transform='rotate(-15 80 62)'/></g><g stroke='%236c8f83' stroke-width='0.5' opacity='0.4'><path d='M76 64 L84 60'/></g><g fill='%239487a8' opacity='0.3'><ellipse cx='40' cy='50' rx='4.5' ry='1.9' transform='rotate(20 40 50)'/></g><g stroke='%238678a0' stroke-width='0.5' opacity='0.35'><path d='M36 51 L44 49'/></g></svg>");
    background-size:100px 100px;
  }
  .screen{
    width:100%;
    height:100%;
    min-height:100vh;
    min-height:100dvh;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    padding: max(14px, env(safe-area-inset-top)) 10px max(14px, env(safe-area-inset-bottom));
    position:relative;
    z-index:1;
  }

  .stage{
    width:100%;
    max-width:min(92vw, 640px);
    max-height:80vh;
    max-height:80dvh;
    flex: 0 1 auto;
    perspective: 1800px;
    -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
    cursor:pointer;
    user-select:none;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    max-width:min(92vw, 640px);
    max-height:min(92vw, 640px);
    aspect-ratio: 1 / 1;
    transform-style:preserve-3d;
    transition: transform 0.7s cubic-bezier(.65,.05,.36,1);
    will-change: transform;
    margin:auto;
  }
  .card.spin{ transform: rotateY(180deg); }
  .card.noanim{ transition:none !important; }

  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius: 14px;
    overflow:visible;
    background:#fff;
    box-shadow: var(--card-shadow);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .face.back{ transform: rotateY(180deg); }
  .face.is-card-face{
    background:transparent;
    box-shadow:none;
  }

  .face img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
  }
  .face img.as-card{
    max-width:82%;
    max-height:82%;
    width:auto;
    height:auto;
    border-radius:6px;
    box-shadow: 0 14px 30px -10px rgba(40,60,55,0.28);
  }

  .dots{
    display:flex;
    gap:9px;
    align-items:center;
    flex:0 0 auto;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    background: var(--dot);
    transition: background .35s ease, transform .35s ease;
  }
  .dot.active{
    background: var(--dot-active);
    transform: scale(1.35);
  }

  .hint{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12.5px;
    letter-spacing: .04em;
    color: var(--hint);
    opacity: .85;
    text-align:center;
    transition: opacity .5s ease;
    display:flex;
    align-items:center;
    gap:6px;
    flex:0 0 auto;
  }
  .hint.fade{ opacity: 0; }

  .hint svg{
    width:13px; height:13px;
    animation: tapbeat 1.8s ease-in-out infinite;
  }
  @keyframes tapbeat{
    0%,100%{ transform: scale(1); opacity:.9; }
    50%{ transform: scale(1.18); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition-duration: .01ms; }
    .hint svg{ animation: none; }
  }
</style>
</head>
<body>

<div class="screen">
  <div class="stage" id="stage" role="button" aria-label="Toca para pasar la página">
    <div class="card" id="card">
      <div class="face front">
        <img id="imgFront" src="cover.jpg" alt="">
      </div>
      <div class="face back">
        <img id="imgBack" src="invite.jpg" alt="">
      </div>
    </div>
  </div>

  <div class="dots" id="dots">
    <span class="dot active" data-i="0"></span>
    <span class="dot" data-i="1"></span>
    <span class="dot" data-i="2"></span>
  </div>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 11.5V6a1.5 1.5 0 0 1 3 0v4"/>
      <path d="M12 9.8V4.5a1.5 1.5 0 0 1 3 0V10"/>
      <path d="M15 9.5a1.5 1.5 0 0 1 3 0V13"/>
      <path d="M6 11V8.5a1.5 1.5 0 0 1 3-.2"/>
      <path d="M18 13v3a6 6 0 0 1-6 6h-1a6 6 0 0 1-5.6-3.8L4 14.5c-.5-1 .1-2.3 1.4-2.4a1.7 1.7 0 0 1 1.6.9"/>
    </svg>
    <span>Toca para pasar la página</span>
  </div>
</div>

<script>
(function(){
  var images = ["cover.jpg", "invite.jpg", "thanks.jpg"];
  var idx = 0; // index currently shown on front
  var spinning = false;

  var card = document.getElementById('card');
  var stage = document.getElementById('stage');
  var faceFront = document.querySelector('.face.front');
  var faceBack = document.querySelector('.face.back');
  var imgFront = document.getElementById('imgFront');
  var imgBack = document.getElementById('imgBack');
  var hint = document.getElementById('hint');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function next(idx){ return (idx + 1) % images.length; }

  // "thanks.jpg" (the account/IBAN page) shows at real card size, floating
  // directly on the textured background instead of inside a white square.
  function setCardLook(faceEl, imgEl, imageIndex){
    var isCard = images[imageIndex] === 'thanks.jpg';
    imgEl.classList.toggle('as-card', isCard);
    faceEl.classList.toggle('is-card-face', isCard);
  }

  setCardLook(faceFront, imgFront, idx);

  imgBack.src = images[next(idx)];
  setCardLook(faceBack, imgBack, next(idx));

  function setDots(activeIdx){
    dots.forEach(function(d){
      d.classList.toggle('active', parseInt(d.dataset.i,10) === activeIdx);
    });
  }

  function flip(){
    if (spinning) return;
    spinning = true;
    hint.classList.add('fade');

    card.classList.add('spin');

    card.addEventListener('transitionend', function onEnd(e){
      if (e.propertyName !== 'transform') return;
      card.removeEventListener('transitionend', onEnd);

      idx = next(idx);
      var upcoming = next(idx);

      // Snap back to 0deg instantly, with the (now current) image as the front face.
      card.classList.add('noanim');
      card.classList.remove('spin');
      imgFront.src = images[idx];
      imgBack.src = images[upcoming];
      setCardLook(faceFront, imgFront, idx);
      setCardLook(faceBack, imgBack, upcoming);

      // Force reflow so the browser applies the no-transition jump before we re-enable it.
      void card.offsetWidth;
      card.classList.remove('noanim');

      setDots(idx);
      spinning = false;
    });
  }

  stage.addEventListener('click', flip);

  stage.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      flip();
    }
  });
  stage.setAttribute('tabindex', '0');

  // basic swipe support
  var touchStartX = null;
  stage.addEventListener('touchstart', function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    touchStartX = null;
    if (Math.abs(dx) > 30) flip();
  }, {passive:true});
})();
</script>
</body>
</html>
